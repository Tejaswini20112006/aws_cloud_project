<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudentHub | Student Directory</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(120deg,#172554,#2563eb);color:#fff;padding:34px max(24px,calc((100vw - 1040px)/2)) 40px}.top small{letter-spacing:.14em;text-transform:uppercase;color:#bfdbfe;font-weight:700}.top h1{margin:12px 0 6px;font-size:clamp(28px,5vw,42px)}.top p{margin:0;color:#dbeafe}.wrap{max-width:1040px;padding:0 22px;margin:-18px auto 60px}.card{background:#fff;border:1px solid #e4eaf4;border-radius:16px;box-shadow:0 12px 32px #17255412;padding:22px;margin-bottom:18px}.row{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end}label{font-size:12px;font-weight:700;color:#53627b;display:block;margin-bottom:7px}input{width:100%;padding:12px 13px;border:1px solid #d6deea;border-radius:9px;font:inherit}input:focus{outline:3px solid #bfdbfe;border-color:#3b82f6}button{border:0;border-radius:9px;padding:12px 16px;background:#2563eb;color:white;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#1d4ed8}.muted{color:#64748b}.status{min-height:22px;margin-top:12px;color:#b91c1c}.tablehead{display:flex;align-items:center;justify-content:space-between;gap:12px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #edf1f6}th{font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.06em}.delete{padding:8px 11px;background:#fff;color:#b91c1c;border:1px solid #fecaca}.delete:hover{background:#fef2f2}.pill{display:inline-block;border-radius:99px;padding:5px 10px;background:#eff6ff;color:#1d4ed8;font-size:12px}.empty{text-align:center;padding:34px;color:#64748b}@media(max-width:700px){.row{grid-template-columns:1fr}.card{padding:16px}table{font-size:14px}th,td{padding:10px 6px}}
</style></head><body>
<header class="top"><small>No-cost student application</small><h1>StudentHub</h1><p>A simple student directory hosted on Vercel.</p></header>
<main class="wrap"><section class="card"><h2>Add a student</h2><form id="student-form" class="row"><div><label for="name">Full name</label><input id="name" name="name" placeholder="Aarav Mehta" required></div><div><label for="email">Email</label><input id="email" name="email" type="email" placeholder="aarav@example.edu" required></div><div><label for="course">Course</label><input id="course" name="course" placeholder="Computer Science" required></div><button type="submit">Add student</button></form><div id="status" class="status" role="status"></div><p id="mode-note" class="muted" style="font-size:13px;margin-bottom:0"></p></section>
<section class="card"><div class="tablehead"><div><h2 style="margin:0 0 4px">Student directory</h2><span class="muted" id="count">Loading…</span></div><button id="refresh" type="button">Refresh</button></div><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Email</th><th>Course</th><th></th></tr></thead><tbody id="students"></tbody></table></div></section>
<p class="muted" style="text-align:center;font-size:13px">Free preview · Records saved in this browser</p></main>
<script>
const localMode = true;
const form=document.querySelector("#student-form"), body=document.querySelector("#students"), statusBox=document.querySelector("#status"), count=document.querySelector("#count");
const modeNote=document.querySelector("#mode-note");
modeNote.textContent="No-cost mode: records are saved in this browser only and are not shared with other users or devices.";
async function request(path="",options={}){const key="studenthub-records";let items=JSON.parse(localStorage.getItem(key)||"[]");const method=options.method||"GET";if(method==="GET"&&path==="/students")return items;if(method==="POST"){const student={...JSON.parse(options.body||"{}"),student_id:crypto.randomUUID()};items.push(student);localStorage.setItem(key,JSON.stringify(items));return student}if(method==="DELETE"){const id=decodeURIComponent(path.split("/").pop());items=items.filter(s=>s.student_id!==id);localStorage.setItem(key,JSON.stringify(items));return {deleted:id}}throw Error("Unsupported local action")}function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){count.textContent='Loading…';try{const students=await request('/students');count.textContent=`${students.length} ${students.length===1?'student':'students'}`;body.innerHTML=students.length?students.map(s=>`<tr><td><strong>${escapeHtml(s.name)}</strong><br><span class="pill">${escapeHtml(s.student_id.slice(0,8))}</span></td><td>${escapeHtml(s.email)}</td><td>${escapeHtml(s.course)}</td><td><button class="delete" data-id="${escapeHtml(s.student_id)}">Delete</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No students yet. Add the first student above.</td></tr>';statusBox.textContent=''}catch(e){count.textContent='Could not load';statusBox.textContent=e.message}}
form.addEventListener('submit',async e=>{e.preventDefault();statusBox.textContent='';const data=Object.fromEntries(new FormData(form));try{await request('/students',{method:'POST',body:JSON.stringify(data)});form.reset();await load()}catch(err){statusBox.textContent=err.message}});
body.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;if(!confirm('Delete this student record?'))return;try{await request('/students/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});await load()}catch(err){statusBox.textContent=err.message}});
document.querySelector('#refresh').addEventListener('click',load);load();
</script></body></html>
